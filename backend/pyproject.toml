[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-ai-agent-backend"
version = "0.1.0"
description = "Standalone local-first Gmail AI agent backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "python-dotenv>=1.0,<2.0",
  "google-api-python-client>=2.140,<3.0",
  "google-auth>=2.34,<3.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "google-auth-httplib2>=0.2,<1.0",
  "cryptography>=43.0,<48.0",
  "httpx>=0.27,<1.0",
  "pypdf>=5.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["gmail_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
