name: InboxMind checks

on:
  pull_request:
    branches:
      - feat/secure-multi-tenant-deployment
      - feat/universal-hosted-multi-tenant
  push:
    branches:
      - feat/hosted-ollama-production
      - feat/universal-hosted-multi-tenant

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inboxmind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inboxmind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      INBOXMIND_TEST_DATABASE_URL: postgresql://inboxmind_test:inboxmind_test@localhost:5432/inboxmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare isolated PostgreSQL schema and app role
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: inboxmind_test
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE inboxmind_test LOGIN PASSWORD 'inboxmind_test' NOSUPERUSER NOBYPASSRLS;"
          for migration in backend/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO inboxmind_test;"
          psql -v ON_ERROR_STOP=1 -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO inboxmind_test;"
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO inboxmind_test;"
      - name: Run backend tests including real PostgreSQL RLS isolation
        working-directory: backend
        run: pytest -q
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q gmail_agent tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
